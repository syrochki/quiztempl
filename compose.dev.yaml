services:
  web:
    build:
      context: .
      dockerfile: dockerfiles/dev/Dockerfile
    container_name: quiztempl-web
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_SYNC: "1"
      VALKEY_URL: redis://valkey:6379/0
    volumes:
      - ./src:/app/src
      - sqlite_data:/app/data
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --appendonly yes
    container_name: quiztempl-valkey
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  sqlite_data:
  valkey_data: